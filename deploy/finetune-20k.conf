[program:hw2-finetune-20k]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/hw2-finetune-20k.sh
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
