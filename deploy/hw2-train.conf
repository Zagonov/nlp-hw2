[program:hw2_train]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/hw2-train.sh
directory=/workspace/hw-2
autostart=false
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/portal/hw2-train.log
stdout_logfile_maxbytes=0

