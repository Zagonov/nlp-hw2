[program:hw2-weighted-constant-10k]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/hw2-weighted-constant-10k.sh
autostart=false
autorestart=false
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=600
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
